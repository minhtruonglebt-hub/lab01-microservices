<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frontend – index.html</title>
<style>
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #f3f5f7; color: #1d2b36;
         margin: 0; padding: 24px 16px; line-height: 1.5; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; text-align: center; margin: 0 0 4px; }
  .sub { text-align: center; color: #5b6b76; margin: 0 0 20px; font-size: .9rem; }
  .diagram { display: flex; gap: 12px; margin-bottom: 20px; }
  .box { flex: 1; padding: 12px; border-radius: 8px; text-align: center; border: 1px solid; font-size: .9rem; }
  .box.p { background: #e3f3ec; border-color: #1f7a5c; }
  .box.o { background: #e4ebfa; border-color: #2a56b8; }
  .card { background: #fff; border: 1px solid #cfd8de; border-radius: 8px; padding: 18px 20px; margin-bottom: 18px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  button, input { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #b8c4cc; }
  button { background: #2a56b8; color: #fff; border: none; cursor: pointer; }
  button:hover { background: #20449a; }
  button:focus-visible, input:focus-visible { outline: 3px solid #f0a500; outline-offset: 2px; }
  pre { background: #f3f5f7; border: 1px solid #cfd8de; border-radius: 6px; padding: 10px 12px;
        min-height: 3em; white-space: pre-wrap; margin-top: 12px; }
  ul { padding-left: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Frontend – index.html</h1>
  <p class="sub">HTML + JavaScript fetch()</p>

  <div class="diagram">
    <div class="box p"><strong>Product Service</strong><br>Port 8081<br>Tải danh sách</div>
    <div class="box o"><strong>Order Service</strong><br>Port 8082<br>Tìm theo ID (Order Service gọi Product Service qua REST API)</div>
  </div>

  <div class="card">
    <h2>Danh sách sản phẩm</h2>

    <button onclick="loadProducts()">
      Tải danh sách sản phẩm
    </button>

    <ul id="productList"></ul>
  </div>

  <div class="card">
    <h2>Tìm sản phẩm thông qua Order Service</h2>

    <input type="number"
           id="productId"
           placeholder="Nhập ID sản phẩm"
           min="1">

    <button onclick="findProduct()">
      Tìm sản phẩm
    </button>

    <pre id="result"></pre>
  </div>
</div>

<script>
async function loadProducts() {
  try {
    const response = await fetch(
      "http://localhost:8081/api/products"
    );

    if (!response.ok) {
      throw new Error("Không thể tải danh sách sản phẩm");
    }

    const products = await response.json();
    const list = document.getElementById("productList");
    list.innerHTML = "";

    if (products.length === 0) {
      list.textContent = "Chưa có sản phẩm";
      return;
    }

    products.forEach(product => {
      const li = document.createElement("li");
      li.textContent =
        `${product.id} - ${product.name}`;
      list.appendChild(li);
    });
  } catch (error) {
    document.getElementById("productList")
      .textContent = "Lỗi: " + error.message;
  }
}

async function findProduct() {
  const id = document.getElementById("productId").value;
  const result = document.getElementById("result");

  if (!id || !Number.isInteger(Number(id)) || Number(id) < 1) {
    result.textContent = "Vui lòng nhập ID hợp lệ";
    return;
  }

  try {
    const response = await fetch(
      `http://localhost:8082/api/orders/product/${id}`
    );

    if (response.status === 404) {
      result.textContent = "Không tìm thấy sản phẩm";
      return;
    }

    if (!response.ok) {
      throw new Error("Không thể lấy thông tin sản phẩm");
    }

    const product = await response.json();
    result.textContent =
      JSON.stringify(product, null, 2);
  } catch (error) {
    result.textContent = "Lỗi: " + error.message;
  }
}
</script>
</body>
</html>
